name: Libbox API Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Build libbox and dump API
    runs-on: ubuntu-latest

    steps:
      - name: Resolve latest stable sing-box tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "sing-box tag: $TAG"

      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ steps.tag.outputs.name }}
          path: sing-box
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.2.12479018"
          ls "$ANDROID_HOME/ndk"

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
          ls -la libbox.aar

      - name: API dump
        working-directory: sing-box
        run: |
          mkdir -p probe && cd probe
          unzip -q -o ../libbox.aar classes.jar
          echo "=== sing-box ${{ steps.tag.outputs.name }} ==="
          javap -public -cp classes.jar \
            io.nekohasekai.libbox.PlatformInterface \
            io.nekohasekai.libbox.TunOptions \
            io.nekohasekai.libbox.Libbox \
            io.nekohasekai.libbox.SetupOptions \
            io.nekohasekai.libbox.CommandServer \
            io.nekohasekai.libbox.CommandServerHandler \
            io.nekohasekai.libbox.InterfaceUpdateListener \
            io.nekohasekai.libbox.NetworkInterface \
            io.nekohasekai.libbox.NetworkInterfaceIterator \
            io.nekohasekai.libbox.StringIterator \
            io.nekohasekai.libbox.RoutePrefix \
            io.nekohasekai.libbox.RoutePrefixIterator \
            2>&1 | tee ../api.txt || true

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            sing-box/libbox.aar
            sing-box/api.txt
          retention-days: 14
