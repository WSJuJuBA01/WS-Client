
name: Build WS Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем исходники WS Client
      - name: Checkout WS Client
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Android SDK Platform, Build Tools и NDK
      - name: Install Android components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          yes | sdkmanager --licenses || true

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # 5. Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      # 6. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 7. Получаем AndroidLibXrayLite
      - name: Checkout Xray Android library
        run: |
          git clone --depth 1 \
            https://github.com/2dust/AndroidLibXrayLite.git \
            /tmp/AndroidLibXrayLite

      # 8. Устанавливаем gomobile
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init

      # 9. Собираем Xray AAR
      - name: Build Xray AAR
        run: |
          cd /tmp/AndroidLibXrayLite

          go mod tidy

          gomobile bind \
            -v \
            -androidapi 24 \
            -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            ./

          echo "Generated AAR files:"
          find . -type f -name "*.aar" -print

          AAR_PATH="$(find . -maxdepth 2 -type f -name '*.aar' | head -n 1)"

          if [ -z "$AAR_PATH" ]; then
            echo "ERROR: gomobile did not generate an AAR"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp "$AAR_PATH" "$GITHUB_WORKSPACE/app/libs/libv2ray.aar"

          test -s "$GITHUB_WORKSPACE/app/libs/libv2ray.aar"

      # 10. Проверяем наличие AAR
      - name: Verify Xray library
        run: |
          ls -lh app/libs/
          test -f app/libs/libv2ray.aar

      # 11. Собираем APK
      - name: Build WS Client
        run: |
          gradle --no-daemon \
            --stacktrace \
            assembleDebug

      # 12. Проверяем APK
      - name: Verify APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

      # 13. Загружаем APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WS-Client-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
